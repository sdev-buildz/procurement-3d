name: Publish the Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment to avoid conflicts
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  publish-micro-app:
    runs-on: ubuntu-latest
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

        # v2
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          runtime: node@24.21.0
          version: 11.27.0

      - run: pnpm exec prettier --write ./pnpm-lock.yaml

      - name: Build React bundles
        run: pnpm run build
        env:
          # Map repository variables to process.env
          ORIGIN: ${{ vars.ORIGIN }}
          WEB_CLIENT_ORIGIN: ${{ vars.WEB_CLIENT_ORIGIN }}
          EMBED_CLIENT_ORIGIN: ${{ vars.EMBED_CLIENT_ORIGIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Remove GLB files before deployment
        run: rm -rf ./packages/embed/dist/**/*.glb

      # - name: Upload artifact
      #   # v5.0.0
      #   uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
      #   with:
      #     # Upload the entire folder generated by TypeDoc
      #     path: './packages/embed/dist'

      # - name: Deploy micro-app to GitHub Pages
      #   id: deployment
      #   # v5.0.0
      #   uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

      - name: Deploy host to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          workingDirectory: ./packages/procurement
          command: 'deploy'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          secrets: |
            DATABASE_URL
            DIRECT_URL
            JWE_KEY
            EMBED_CLIENT_ORIGIN
            ORIGIN
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWE_KEY: ${{ secrets.JWE_KEY }}
          EMBED_CLIENT_ORIGIN: ${{ vars.EMBED_CLIENT_ORIGIN }}
          ORIGIN: ${{ vars.ORIGIN }}

      # Deploy micro-app frontend to Cloudflare
      - name: Deploy micro-app to Cloudflare
        if: steps.should-deploy.outputs.micro-app == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          workingDirectory: ./packages/embed
          command: 'deploy --config ./cloudflare.jsonc'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_MICRO_APP }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
