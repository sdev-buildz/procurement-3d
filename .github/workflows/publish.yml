name: Publish the Apps

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment to avoid conflicts
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  publish-micro-app:
    runs-on: ubuntu-latest
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

        # v2
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          runtime: node@24.21.0
          version: 11.27.0

      - run: pnpm exec prettier --write ./pnpm-lock.yaml

      - name: Build React bundles
        run: pnpm run build

      - name: Remove GLB files before deployment
        run: rm -rf ./packages/embed/dist/**/*.glb

      # - name: Upload artifact
      #   # v5.0.0
      #   uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
      #   with:
      #     # Upload the entire folder generated by TypeDoc
      #     path: './packages/embed/dist'

      # - name: Deploy micro-app to GitHub Pages
      #   id: deployment
      #   # v5.0.0
      #   uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

      - name: Deploy host to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          working-directory: ./packages/procurement
          command: 'deploy --config ./packages/procurement/cloudflare.jsonc'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
