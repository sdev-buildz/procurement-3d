name: Publish the Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment to avoid conflicts
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  publish-micro-app:
    runs-on: ubuntu-latest
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

        # v2
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          runtime: node@24.21.0
          version: 11.27.0

      - run: pnpm exec prettier --write ./pnpm-lock.yaml

      # Check which services need to be deployed, by checking the changed files
      - name: Check workspace changes
        # v4
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: should-deploy
        with:
          filters: |
            prisma:
              - 'packages/db/**'
              - 'pnpm-lock.yaml'
            host-app:
              - 'packages/procurement/**'
              - 'pnpm-lock.yaml'
            micro-app:
              - 'packages/micro-app/**'
              - 'pnpm-lock.yaml'

      # Build React bundles and Prisma Client.
      - name: Build
        run: pnpm run build
        env:
          # Map repository variables to process.env
          ORIGIN: ${{ vars.ORIGIN }}
          WEB_CLIENT_ORIGIN: ${{ vars.WEB_CLIENT_ORIGIN }}
          EMBED_CLIENT_ORIGIN: ${{ vars.EMBED_CLIENT_ORIGIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Deploy Prisma migrations
      - name: Run Prisma migrations
        if: steps.should-deploy.outputs.prisma == 'true'
        run: pnpm run prisma:migrate-prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Seed the database
      - name: Seed the database
        if: steps.should-deploy.outputs.prisma == 'true'
        run: pnpm run prisma:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Remove GLB files. Part of the previous build step.
      - name: Remove GLB files before deployment
        run: rm -rf ./packages/embed/dist/**/*.glb

      # Deploy host app's frontend and API server to Cloudflare
      - name: Deploy host to Cloudflare
        if: steps.should-deploy.outputs.host-app == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          workingDirectory: ./packages/procurement
          command: 'deploy'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          secrets: |
            DATABASE_URL
            DIRECT_URL
            JWE_KEY
            EMBED_CLIENT_ORIGIN
            ORIGIN
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWE_KEY: ${{ secrets.JWE_KEY }}
          EMBED_CLIENT_ORIGIN: ${{ vars.EMBED_CLIENT_ORIGIN }}
          ORIGIN: ${{ vars.ORIGIN }}

      # Deploy micro-app frontend to Cloudflare
      - name: Deploy micro-app to Cloudflare
        if: steps.should-deploy.outputs.micro-app == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          workingDirectory: ./packages/embed
          command: 'deploy'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_MICRO_APP }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
