name: Publish the Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment to avoid conflicts
concurrency:
  group: 'publish-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

jobs:
  publish-micro-app:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

        # v2
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          runtime: node@24.21.0
          version: 11.27.0

      - run: pnpm exec prettier --write ./pnpm-lock.yaml

      # Check which services need to be deployed, by checking the changed files
      - name: Check workspace changes
        # v4
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: should-deploy
        with:
          filters: |
            prisma:
              - 'packages/db/**'
              - 'pnpm-lock.yaml'
            host-app:
              - 'packages/procurement/**'
              - 'pnpm-lock.yaml'
            micro-app:
              - 'packages/micro-app/**'
              - 'pnpm-lock.yaml'

      - name: Set deployment origins
        id: deployment
        env:
          ORIGIN: ${{ vars.ORIGIN }}
          WEB_CLIENT_ORIGIN: ${{ vars.WEB_CLIENT_ORIGIN }}
          EMBED_CLIENT_ORIGIN: ${{ vars.EMBED_CLIENT_ORIGIN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: node ./scripts/set-deployment-origins.ts

      # Build React bundles and Prisma Client.
      - name: Build
        run: pnpm run build
        env:
          # Map repository variables to process.env
          ORIGIN: ${{ steps.deployment.outputs.origin }}
          WEB_CLIENT_ORIGIN: ${{ steps.deployment.outputs.web_client_origin }}
          EMBED_CLIENT_ORIGIN: ${{ steps.deployment.outputs.embed_client_origin }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Deploy Prisma migrations
      - name: Run Prisma migrations
        if: github.event_name != 'pull_request' && steps.should-deploy.outputs.prisma == 'true'
        run: pnpm run prisma:migrate-prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Seed the database
      - name: Seed the database
        if: github.event_name != 'pull_request' && steps.should-deploy.outputs.prisma == 'true'
        run: pnpm run prisma:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Remove GLB files. Part of the previous build step.
      - name: Remove GLB files before deployment
        run: rm -rf ./packages/embed/dist/**/*.glb

      # Deploy host app's frontend and API server to Cloudflare
      - name: Deploy host to Cloudflare
        # if: steps.should-deploy.outputs.host-app == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          workingDirectory: ./packages/procurement
          command: 'deploy --name ${{ steps.deployment.outputs.host_name }}'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_HOST_APP }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          secrets: |
            DATABASE_URL
            DIRECT_URL
            JWE_KEY
            EMBED_CLIENT_ORIGIN
            ORIGIN
            GOOGLE_OAUTH2_CLIENT_ID
            GOOGLE_OAUTH2_CLIENT_SECRET
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWE_KEY: ${{ secrets.JWE_KEY }}
          GOOGLE_OAUTH2_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH2_CLIENT_ID }}
          GOOGLE_OAUTH2_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH2_CLIENT_SECRET }}
          EMBED_CLIENT_ORIGIN: ${{ steps.deployment.outputs.embed_client_origin }}
          ORIGIN: ${{ steps.deployment.outputs.origin }}

      # Set micro-app frame ancestor
      - name: Set micro-app frame ancestor
        run: pnpm --filter @packages/embed-3d run set-host-origin
        env:
          HOST_ORIGIN: ${{ steps.deployment.outputs.origin }}

      # Deploy micro-app frontend to Cloudflare
      - name: Deploy micro-app to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          workingDirectory: ./packages/embed
          command: 'deploy --name ${{ steps.deployment.outputs.embed_name }}'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_MICRO_APP }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
