services:
  postgres:
    image: postgres:18 # Use a specific PostgreSQL image
    ports:
      - name: db-port
        target: '${POSTGRES_TARGET_PORT:-5432}'
        # host_ip: 127.0.0.1
        published: '${POSTGRES_PUBLISHED_PORT:-5434}'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      # Persistant storgae volume using bind mount
      - ${PG_VOLUME_HOST_PATH:-C:\projects\postgres-volumes}:${PG_VOLUME_CONTAINER_PATH:-/var/lib/postgresql/18/docker}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 10s
      retries: 5

  minio:
    image: quay.io/minio/minio
    container_name: local_object_storage
    ports:
      - '9000:9000' # API Port (Your React/Backend connects here)
      - '9001:9001' # Web Console Port (Log in via your browser)
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rootadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}
    command: server /data --console-address ":9001"

volumes:
  minio_data:
