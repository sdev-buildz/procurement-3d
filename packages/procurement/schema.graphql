"""An Approval to a bid line item"""
type Approval {
  bidLineItems: [BidLineItem!]
  decision: Boolean
  id: ID
  justification: String
  rfq: Rfq
  rfqId: ID
}

"""A Bid"""
type Bid {
  bidLineItems: [BidLineItem!]
  id: ID
  rfq: Rfq
  rfqId: ID
  supplier: Supplier
  supplierId: ID
  technicalNotes: String
}

"""A Bid LineItem"""
type BidLineItem {
  bid: Bid
  bidId: ID
  id: ID
  leadTimeWeeks: Int
  rfqLineItem: RfqLineItem
  rfqLineItemId: ID
  technicalNotes: String
  totalAmount: Int
}

"""A Buyer"""
type Buyer {
  createdAt: DateTime
  id: ID
  name: String
  rfqsCreated: [Rfq!]
  updatedAt: DateTime
  user: User1
}

"""COUNTRY"""
enum COUNTRY {
  CHINA
  GLOBAL
  INDIA
  VIETNAM
}

"""Checkout input"""
input CheckoutInput {
  count: Int!
  id: ID!
}

"""ComplianceStatus of supplier"""
enum ComplianceStatus {
  FLAGGED
  PENDING
  VERIFIED
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

input FilterInput {
  comlianceStatus: ComplianceStatus
  companyNames: [String!]
  country: COUNTRY
  ids: [Int!]
  pagination: PaginationInput
  sort: SortBidsEnum
}

type LoginResult {
  token: String
  user: LoginUser
}

type LoginUser {
  email: String
  id: ID
  role: UserRole
}

"""The schema root for mutating data"""
type Mutation {
  """Checkout cart"""
  checkout(cart: [CheckoutInput!]!): [Product!]

  """Authenticate with an email and password."""
  login(email: String!, password: String!): LoginResult
}

input PaginationInput {
  skip: Int
  take: Int
}

"""A Product"""
type Product {
  description: String
  id: ID
  imageUrl: String
  name: String
  price: Int
  stockCount: Int
  summary: String
}

"""The schema root for fetching data."""
type Query {
  """Used by buyers to review bids."""
  bidsOfRfq(filter: FilterInput, rfqId: Int!): [Rfq!]

  """Used by buyers to review bids."""
  bidsOfRfq1(filter: FilterInput, rfqId: Int!): [Rfq!]

  """Fetch a product by id."""
  productById(id: ID!): Product

  """List of available products."""
  products: [Product!]
}

"""A request for quotation"""
type Rfq {
  bidClosingDate: String
  buyerId: ID
  createdAt: String
  deliveryDeadline: String
  description: String
  id: ID
  rfqLineItems: [RfqLineItem!]
  status: String
  title: String
  updatedAt: String
}

"""A line item in a request for quotation"""
type RfqLineItem {
  bidLineItems: [BidLineItem!]
  id: ID
  quantity: Int
  rfqId: ID
}

"""RfqStatus"""
enum RfqStatus {
  AWARDED
  CLOSED
  DRAFT
  OPEN
}

enum SortBidsEnum {
  leadTimeWeeks
  totalAmount
}

"""The schema root for subscriptions"""
type Subscription {
  """Updates the available stock in real-time."""
  productUpdates: [Product!]
}

"""A Supplier"""
type Supplier {
  bidsSubmitted: [Bid!]
  companyName: String
  complianceStatus: ComplianceStatus
  country: COUNTRY
  createdAt: DateTime
  id: ID
  taxId: String
  updatedAt: DateTime
  user: User1
}

"""A User"""
type User1 {
  createdAt: DateTime
  email: String
  id: ID
  role: UserRole
  updatedAt: DateTime
}

"""User roles"""
enum UserRole {
  ADMIN
  BUYER
  SALES_ENGINEER
  SUPPLIER
}